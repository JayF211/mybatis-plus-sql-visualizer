# P-立项-05：方言真实验证本地环境（可选，Phase 2 Tier 2）
#
# 用途：无 Testcontainers / 想复用长期运行的数据库实例时，`docker compose up -d` 起本套环境，
# 再以外部实例方式执行验证：
#
#   ./gradlew test --tests '*DialectDockerVerificationTest*' \
#     -Dmpvs.dialect.jdbcUrl="jdbc:mysql://localhost:3306/p05?useSSL=false&allowPublicKeyRetrieval=true" \
#     -Dmpvs.dialect.user=root -Dmpvs.dialect.password=p05pass -Dmpvs.dialect.name="MySQL"
#
# DM（达梦）/ KingBase（人大金仓）无官方公开镜像——真实环境验证需指向用户自有实例
# （官方文档级验证见 DialectDocGoldenTest）。
#
# 端口分配避让常用端口；凭据仅限本地验证环境。

services:
  mysql80:
    image: mysql:8.0.36
    environment:
      MYSQL_ROOT_PASSWORD: p05pass
      MYSQL_DATABASE: p05
    ports:
      - "13306:3306"

  postgres16:
    image: postgres:16.2
    environment:
      POSTGRES_PASSWORD: p05pass
      POSTGRES_DB: p05
    ports:
      - "15432:5432"

  mariadb11:
    image: mariadb:11.2
    environment:
      MARIADB_ROOT_PASSWORD: p05pass
      MARIADB_DATABASE: p05
    ports:
      - "13307:3306"

  sqlserver2022:
    image: mcr.microsoft.com/mssql/server:2022-CU12-ubuntu-22.04
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "P05pass!strong"
    ports:
      - "11433:1433"

  oracle23free:
    image: gvenzl/oracle-free:23.5-slim
    environment:
      ORACLE_PASSWORD: p05pass
      APP_USER: p05
      APP_USER_PASSWORD: p05pass
    ports:
      - "11521:1521"
