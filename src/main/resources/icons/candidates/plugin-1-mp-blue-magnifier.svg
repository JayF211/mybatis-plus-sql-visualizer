<svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- plugin-A：MP 蓝底 + 白色放大镜（柄为「+」号呼应 MyBatis-Plus）+ 镜片内代码行 -->
    <!-- MP 蓝圆角方底（MyBatis-Plus 品牌色 #1E9FFF） -->
    <rect x="1" y="1" width="38" height="38" rx="9" fill="#1E9FFF"/>
    <!-- 放大镜镜片（白色）：内含三条代码线（SQL/代码感） -->
    <circle cx="19" cy="18" r="10" stroke="#FFFFFF" stroke-width="2.6"/>
    <line x1="13.5" y1="14.5" x2="24.5" y2="14.5" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"/>
    <line x1="13.5" y1="18" x2="22" y2="18" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"/>
    <line x1="13.5" y1="21.5" x2="19.5" y2="21.5" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"/>
    <!-- 放大镜柄为「+」号（MyBatis-Plus 的 Plus 元素） -->
    <line x1="27" y1="31" x2="33" y2="31" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round"/>
    <line x1="30" y1="28" x2="30" y2="34" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round"/>
</svg>
