<svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- gutter-A：大放大镜 + 镜片内代码行（预览 SQL/代码 的感觉） -->
    <!-- 放大镜镜片（紫色，预览主导）：内含三条递减代码线（代码文本感） -->
    <circle cx="8.3" cy="7.5" r="5.3" stroke="#B48EFF" stroke-width="1.5"/>
    <line x1="5.8" y1="5.9" x2="10.8" y2="5.9" stroke="#B48EFF" stroke-width="1.3" stroke-linecap="round"/>
    <line x1="5.8" y1="7.8" x2="9.5" y2="7.8" stroke="#B48EFF" stroke-width="1.3" stroke-linecap="round"/>
    <line x1="5.8" y1="9.7" x2="8.2" y2="9.7" stroke="#B48EFF" stroke-width="1.3" stroke-linecap="round"/>
    <!-- 放大镜柄 -->
    <line x1="12.4" y1="11.6" x2="14.5" y2="13.7" stroke="#B48EFF" stroke-width="1.5" stroke-linecap="round"/>
</svg>
