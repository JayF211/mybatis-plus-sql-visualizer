    <line x1="5.2" y1="6.6" x2="11.8" y2="6.6" stroke="#40B6E0" stroke-width="1.2"/>
    <line x1="8.5" y1="6.6" x2="8.5" y2="10.2" stroke="#40B6E0" stroke-width="1.2"/>
