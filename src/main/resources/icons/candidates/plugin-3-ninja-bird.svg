<svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- plugin-C：简化蓝色忍者鸟 + 头带「+」号（致敬 MyBatis-Plus 官方 logo）+ 紫色放大镜角标（预览） -->
    <!-- 鸟头（MP 蓝圆） -->
    <circle cx="15" cy="15" r="7.5" fill="#1E9FFF"/>
    <!-- 鸟身体（半圆鼓包） -->
    <path d="M6 21 C6 32, 24 32, 24 21 Z" fill="#1E9FFF"/>
    <!-- 头带「+」号（白色，MyBatis-Plus 头带元素） -->
    <line x1="9" y1="15" x2="21" y2="15" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="15" y1="10.5" x2="15" y2="19.5" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
    <!-- 眼睛（白点） -->
    <circle cx="18.5" cy="12.5" r="1.7" fill="#FFFFFF"/>
    <!-- 放大镜角标（紫色，预览语义） -->
    <circle cx="31" cy="29.5" r="5.8" stroke="#B48EFF" stroke-width="2.2"/>
    <line x1="35.6" y1="34.1" x2="37.6" y2="36.1" stroke="#B48EFF" stroke-width="2.2" stroke-linecap="round"/>
</svg>
