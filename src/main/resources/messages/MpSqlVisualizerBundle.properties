# F-2 SQL performance analysis suggestions (20 rules)
# --- Batch 1: regex-based ---
perf.missing_where={0} without WHERE clause — full table operation risk! This will affect all rows
perf.leading_wildcard=LIKE '%xxx' with leading wildcard — cannot use B-Tree index; consider full-text search or suffix matching
perf.select_star=SELECT * detected — specify columns explicitly to reduce network transfer and avoid covering index failure
perf.select_star_with_join=SELECT * with JOIN — redundant field transfer; specify columns explicitly
perf.order_by_without_limit=ORDER BY without LIMIT — may return large result set; consider adding LIMIT
perf.order_by_rand=ORDER BY RAND() — full table sort, extremely poor performance on large tables
perf.union_instead_of_union_all=UNION deduplicates (expensive); use UNION ALL if duplicates are acceptable
# --- Batch 2: AST-based ---
perf.join_without_on=JOIN without ON condition — Cartesian product risk! Add an ON condition
perf.subquery_depth=Subquery nesting depth {0} > 2 — consider rewriting as JOIN for better performance
perf.in_clause_overflow=IN clause has {0} items exceeding 100 — consider temporary table or batch query
perf.function_on_column=Function wrapping column(s): {0} — prevents index usage; compare values directly
perf.or_condition_count=WHERE has {0} OR conditions > 3 — consider UNION ALL or IN clause
perf.distinct_with_join=SELECT DISTINCT with JOIN — may indicate missing JOIN condition; verify join logic
perf.group_by_without_aggregate=GROUP BY without aggregate function — may be unnecessary; consider DISTINCT instead
perf.no_limit_large_result=No LIMIT + multiple JOINs + no WHERE — large result set risk; add LIMIT or WHERE
# --- Batch 3: advanced ---
perf.correlated_subquery=Correlated subquery — executes once per outer row; consider JOIN rewrite
perf.implicit_type_conversion=Implicit type conversion on column(s): {0} — prevents index usage; match types explicitly
perf.between_on_dates={0} BETWEEN on date column(s) — watch for boundary issues; consider >= and < instead
perf.nested_subquery_in_select={0} subquery(ies) in SELECT clause — executes per row; consider JOIN rewrite
perf.offset_pagination=Large OFFSET ({0}) — deep pagination is slow; consider keyset pagination
perf.multiple_group_by_orders=Complex GROUP BY + ORDER BY combination — may cause temporary table and filesort
# --- Legacy (T-SqlPerf, kept for backward compat) ---
perf.no_where=SELECT without WHERE clause — full table scan risk! Add a WHERE condition or ensure an index exists
perf.no_where_with_limit=SELECT without WHERE clause but with LIMIT — still risky for large tables; consider adding a WHERE condition
perf.order_by_missing=ORDER BY column(s) {0} not in SELECT list — may cause filesort (back-to-table query)
panel.perf.section=Performance suggestions
panel.perf.warning=Warning
panel.perf.info=Suggestion

