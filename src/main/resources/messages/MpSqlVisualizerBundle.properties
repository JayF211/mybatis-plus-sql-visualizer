# M36.3: connection check + timeout hint
execute.credential.hint=Execution timed out. The password may be expired or the driver may not be downloaded.\n\nPlease close this panel and check the main IDEA window for a password dialog or driver download dialog.\nThen retry after handling it.\n\nFix: Open Database tool window → right-click data source → Properties → Test connection / Download driver.
# M36.5.3: dumb mode (indexing) hint — query submission deferred, not a failure
execute.indexing.hint=The IDE is building indexes (see the progress bar in the status bar), so the query was submitted but its execution is deferred.\n\nResults will appear in the results area automatically once indexing finishes. If nothing shows up, click "Execute SQL" again after indexing completes.
# M36.5.48: no runnable statement — real reason (was wrongly credential.hint)
execute.noStatement=No runnable SQL statement was found in the editor.\n\nCheck that the SQL is selected/caret is in a valid statement, then retry.
# T-ExecSilentNoop: execution not submitted (DBN silently dropped it) — real-reason分流, no longer misattributed to password/driver
execute.notSubmitted.hint=The SQL was not executed: target data source {0} did not receive this query.\n\nThe usual causes: the submit landed while IDE indexing/dialect resolution was still running (common on the first preview), or the caret is not inside the statement.\n\nMove the caret into the SQL statement and click "Execute SQL" again. If it still fails, close the panel, reopen the preview and retry.
# T-ExecSilentNoop: connection was actually started but no result came back — the genuine timeout
execute.timeout.hint=The SQL was submitted but waiting for the result timed out.\n\nIf the data source needs a password, check the main IDEA window for a password dialog. If the connection never establishes, open the Database tool window → right-click the data source → Properties → Test connection / Download driver.
# T-ExecCopyFix: temp file failure — carry the concrete stage/exception so users (and logs) can attribute
