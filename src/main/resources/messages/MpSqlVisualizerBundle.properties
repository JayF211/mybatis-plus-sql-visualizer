# T-M39 Help dialog (toolbar "?" button)
log.panel.help=Help
help.dialog.title=MyBatis-Plus SQL Visualizer - Help
help.dialog.close=Close
help.content.features=<h3>Core features</h3>\
<ul>\
<li><b>Wrapper → SQL preview</b>: convert MyBatis-Plus / MPJ Wrapper chains in Java code to readable SQL in real time (9 dialects, dynamic-condition toggles, logic-delete / optimistic-lock injection)</li>\
<li><b>SQL log capture & restore</b>: listen to the run console and restore executable SQL from Preparing / Parameters lines (dedupe / filter / timestamp / logic-delete value)</li>\
<li><b>SQL → Java reverse conversion</b>: convert SQL to QueryWrapper / LambdaQueryWrapper / Wrappers factory / MPJ code — SELECT, UPDATE, DELETE, INSERT, multi-table JOIN, optional Service/Mapper caller and return VO</li>\
<li><b>XML / annotation dynamic SQL preview</b>: preview dynamic SQL of mapper XML and @Select etc. (if / foreach / OGNL, replicating MyBatis 3.5.19)</li>\
<li><b>SQL code completion</b>: keyword completion in the preview panel / input area (type-as-you-go) and inside XML / annotation SQL</li>\
<li><b>Execute SQL & updates</b>: one-click execution in the dialog (Ultimate + Database); check for updates and auto-install in Settings</li>\
</ul>
help.content.usage=<h3>Usage</h3>\
<ul>\
<li><b>Preview</b>: place the caret on a Wrapper chain, then right-click "Convert to SQL", press Alt+Shift+Q, or click the gutter icon</li>\
<li><b>Log</b>: open the "SQL Logs" tab → click Capture → run your application; right-click an entry to copy / delete / send it to SQL → Java or Log → SQL</li>\
<li><b>Reverse conversion</b>: select SQL text → Alt+Shift+J, or paste SQL in the "SQL → Java" tab (adjustable shape / caller class / VO)</li>\
<li><b>Configuration</b>: Settings → Tools → MyBatis-Plus SQL Visualizer (dialect / format / logic delete / table prefix / updates)</li>\
</ul>
help.content.shortcuts=<h3>Default shortcuts</h3>\
<ul>\
<li><b>Convert to SQL</b>: Alt+Shift+Q (Windows / Linux / macOS)</li>\
<li><b>Convert SQL to MP Java Code</b>: Alt+Shift+J (Windows / Linux), Cmd+Shift+J (macOS)</li>\
</ul>\
<p>Change them anytime in Settings → Keymap.</p>
help.content.other=<h3>Other</h3>\
<ul>\
<li>Feedback: Gitee Issues — https://gitee.com/songrenshuo/mybatis-plus-sql-visualizer/issues</li>\
<li>Interface language: Settings → Tools → MyBatis-Plus SQL Visualizer → "Interface language"</li>\
</ul>
