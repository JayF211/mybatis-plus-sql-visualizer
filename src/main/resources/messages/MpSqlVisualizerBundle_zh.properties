panel.banner.degradedPlain=⚠ 预览未挂载 PSI — 本次无上下文补全与注释链路。SQL 文本本身不受影响，关闭并重新打开预览即可重试。
logToSql.banner.noEntry=⚠ 未还原任何语句 — 没有行匹配配置的 Preparing/Parameters 前缀（或 Hibernate/JdbcTemplate 格式）。请检查 设置 > SQL Visualizer > SQL 日志 中的前缀配置，或粘贴完整日志段后重新转换。
logToSql.banner.unresolved=⚠ {0} 条语句仍含未回填的 ? 占位符 — Parameters 行缺失或残缺。补全参数行后重新转换，或执行前手动填写结果中残留的 ?。

