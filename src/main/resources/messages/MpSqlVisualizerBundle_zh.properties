log.panel.help=帮助
help.dialog.title=MyBatis-Plus SQL Visualizer - 帮助
help.dialog.close=关闭
help.content.features=<h3>核心功能</h3>\
<ul>\
<li><b>Wrapper → SQL 预览</b>：Java 代码中的 MyBatis-Plus/MPJ Wrapper 链实时转可读 SQL（9 方言、动态条件开关、逻辑删除/乐观锁注入）</li>\
<li><b>SQL 日志捕获与还原</b>：监听运行控制台，由 Preparing/Parameters 行还原可执行 SQL（去重/过滤/时间戳/逻辑删除值）</li>\
<li><b>SQL → Java 反向转换</b>：SQL 转 QueryWrapper/LambdaQueryWrapper/Wrappers 工厂/MPJ 代码——支持增删改查、多表 JOIN、可选 Service/Mapper 调用类与返回 VO</li>\
<li><b>XML/注解动态 SQL 预览</b>：mapper XML 与 @Select 等注解的 if/foreach/OGNL 动态 SQL 预览（复刻 MyBatis 3.5.19 算法）</li>\
<li><b>SQL 代码补全</b>：预览面板/输入区 SQL 关键字补全（打字即弹）、XML/注解 SQL 内补全</li>\
<li><b>执行 SQL 与更新</b>：弹窗内一键执行（Ultimate + Database）、设置页检查更新与自动安装</li>\
</ul>
help.content.usage=<h3>使用方法</h3>\
<ul>\
<li><b>预览</b>：光标置于 Wrapper 链 → 右键 Convert to SQL / Alt+Shift+Q / 行号区图标</li>\
<li><b>日志</b>：打开「SQL 日志」tab → 点击捕捉 → 运行应用；右键条目复制/删除/发送到 SQL → Java 或日志转 SQL</li>\
<li><b>反向转换</b>：选中 SQL 文本 → Alt+Shift+J，或「SQL → Java」tab 粘贴转换（可调形态/调用类/VO）</li>\
<li><b>配置</b>：Settings → Tools → MyBatis-Plus SQL Visualizer（方言/格式化/逻辑删除/表前缀/更新）</li>\
</ul>
help.content.shortcuts=<h3>默认快捷键</h3>\
<ul>\
<li><b>Convert to SQL</b>：Alt+Shift+Q（Windows / Linux / macOS）</li>\
<li><b>Convert SQL to MP Java Code</b>：Alt+Shift+J（Windows / Linux），Cmd+Shift+J（macOS）</li>\
</ul>\
<p>可在 Settings → Keymap 中修改。</p>
help.content.other=<h3>其他</h3>\
<ul>\
<li>反馈入口：Gitee Issues — https://gitee.com/songrenshuo/mybatis-plus-sql-visualizer/issues</li>\
<li>插件语言切换：Settings → Tools → MyBatis-Plus SQL Visualizer →「界面语言」</li>\
</ul>
