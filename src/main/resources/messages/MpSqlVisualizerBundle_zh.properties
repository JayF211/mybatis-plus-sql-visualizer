# T-SqlPerf SQL 性能分析建议
# --- Batch 1: 正则规则 ---
perf.select_star=检测到 SELECT * —— 建议显式指定列名，减少网络传输并避免覆盖索引失效
perf.select_star_with_join=SELECT * 含 JOIN —— 冗余字段传输，建议显式指定列名
perf.no_where=SELECT 无 WHERE 条件 —— 全表扫描风险！请添加 WHERE 条件或确认已有索引
perf.no_where_with_limit=SELECT 无 WHERE 条件（有 LIMIT）—— 大表仍有风险，建议添加 WHERE 条件
perf.leading_wildcard=LIKE '%xxx' 含前导通配符 —— 无法利用 B-Tree 索引，建议改用全文搜索或后缀匹配
perf.order_by_without_limit=ORDER BY 无 LIMIT —— 可能返回大量结果集，建议添加 LIMIT
perf.order_by_rand=ORDER BY RAND() —— 全表排序，大表性能极差
perf.union_instead_of_union_all=UNION 会去重（开销大）；若允许重复请使用 UNION ALL
perf.order_by_missing=ORDER BY 列 {0} 不在 SELECT 列表中 —— 可能引发 filesort（回表查询）
# --- Batch 2: AST 规则 ---
perf.join_without_on=JOIN 缺少 ON 条件 —— 笛卡尔积风险！请添加 ON 条件
perf.subquery_depth=子查询嵌套深度 {0} > 2 —— 建议改写为 JOIN 提升性能
perf.in_clause_overflow=IN 子句含 {0} 项超过 100 —— 建议用临时表或分批查询
perf.function_on_column=列 {0} 被函数包裹 —— 会导致索引失效，建议直接比较值
perf.or_condition_count=WHERE 含 {0} 个 OR 条件 > 3 —— 建议改用 UNION ALL 或 IN 子句
perf.distinct_with_join=SELECT DISTINCT 含 JOIN —— 可能缺少 JOIN 条件，请检查关联逻辑
perf.group_by_without_aggregate=GROUP BY 无聚合函数 —— 可能不必要，建议改用 DISTINCT
perf.no_limit_large_result=无 LIMIT + 多 JOIN + 无 WHERE —— 大结果集风险，请添加 LIMIT 或 WHERE
perf.missing_where={0} 无 WHERE 条件 —— 全表操作风险！将影响所有行
# --- Batch 3: 高级规则 ---
perf.correlated_subquery=关联子查询 —— 每行外查询执行一次，建议改写为 JOIN
perf.implicit_type_conversion=列 {0} 存在隐式类型转换 —— 会导致索引失效，请显式匹配类型
perf.between_on_dates={0} 日期列使用 BETWEEN —— 注意边界问题，建议改用 >= 和 <
perf.nested_subquery_in_select=SELECT 子句含 {0} 个子查询 —— 每行执行一次，建议改写为 JOIN
perf.offset_pagination=大 OFFSET ({0}) —— 深分页性能慢，建议改用游标分页
perf.multiple_group_by_orders=复杂的 GROUP BY + ORDER BY 组合 —— 可能引发临时表和 filesort
panel.perf.section=性能建议
panel.perf.warning=警告
panel.perf.info=建议

