# T-PreviewUx-Pack #2：诚实降级横幅（面板内嵌非模态提示；三要素=哪段没还原/为什么/用户能做什么）
panel.banner.renderFailed=⚠ 预览未完整还原 — {0} 可检查参数值或调整条件勾选后点「刷新」重试。
