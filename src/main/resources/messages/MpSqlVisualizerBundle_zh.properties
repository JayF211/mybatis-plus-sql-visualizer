execute.credential.hint=执行超时，可能是密码过期或驱动未下载。\n\n请关闭本面板后查看 IDEA 主窗口是否有密码输入框或驱动下载框，\n处理完成后重试。\n\n修复指引：打开 Database 工具窗口 → 右键数据源 → 属性 → 测试连接/下载驱动。
# M36.5.3：索引中提示（dumb mode 下查询提交被推迟，非执行失败）
execute.indexing.hint=IDE 正在建立索引（状态栏有进度条），查询已提交但执行被推迟。\n\n索引完成后结果会自动出现在结果区；若仍无结果，可等索引结束后重新点击「执行 SQL」。
# M36.5.48: 无可执行语句（真实原因，此前误用 credential.hint）
execute.noStatement=编辑器中未找到可执行的 SQL 语句。\n\n请确认 SQL 已选中/光标位于有效语句内后重试。
# T-ExecSilentNoop: 执行未提交（DBN 静默拒绝）——真实原因分流，不再误归因成密码/驱动
execute.notSubmitted.hint=SQL 未执行：目标数据源 {0} 没有接收到本次查询。\n\n常见原因：准备时机撞上 IDE 索引/方言解析（首次预览易触发）；或光标未落在语句内。\n\n请把光标移入 SQL 语句后重新点击「执行 SQL」；若仍无效，关闭面板重新打开预览再试。
# T-ExecSilentNoop: 连接确实发起、但迟迟无结果——真正的超时
execute.timeout.hint=SQL 已提交执行，但等待结果超时。\n\n若数据源需要密码，请检查 IDEA 主窗口是否有密码输入框；若连接一直未建立，打开 Database 工具窗口 → 右键数据源 → 属性 → 测试连接/下载驱动。
