settings.enhancedCapture.confirm.body=<b>增强捕获</b>在您的应用 JVM 内直接挂载捕获点，为本插件提供 SQL 的参数实参、精确耗时、影响行数与执行报错。<br><br>· <b>采集范围</b>：仅本插件工具窗口展示所需的 SQL 语句与参数，无其他数据。<br>· <b>数据留本机</b>：全部数据仅展示在本机 IDE 内，不回传任何服务器。<br>· <b>随时可关</b>：关闭开关即停止采集（已挂载的捕获点会保留但不工作），自动回落控制台日志捕获。<br>· <b>JDK 21+ 提示</b>：应用控制台可能出现一条动态挂载（agent）告警，属 JVM 预期行为（JEP 451），仅告警不影响运行。<br>· <b>取消的代价</b>：点「取消」后 24 小时内不再询问、期间不会挂载，SQL 日志面板将收不到任何条目；可在设置页「重新授权」立即恢复。
