<svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- pluginIcon_dark（M14 约定路径）：深底 + </> 三字符等宽等高垂直对齐（y 14~26，中心 y=20）+ 放大镜右下角标（与亮色版同布局） -->
    <rect x="1" y="1" width="38" height="38" rx="9" fill="#3C3F41"/>
    <!-- <（顶点朝左） -->
    <path d="M12 14 L6.5 20 L12 26" stroke="#4FC1FF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- / -->
    <line x1="13.8" y1="26.8" x2="18.8" y2="13.2" stroke="#4FC1FF" stroke-width="3" stroke-linecap="round"/>
    <!-- >（顶点朝右） -->
    <path d="M18.5 14 L25 20 L18.5 26" stroke="#4FC1FF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- 放大镜（右下角标，直径≈字符高，与 > 轻微重叠） -->
    <circle cx="29.5" cy="29.5" r="5.5" stroke="#6FD39B" stroke-width="2.6"/>
    <line x1="33.5" y1="33.5" x2="36" y2="36" stroke="#6FD39B" stroke-width="2.6" stroke-linecap="round"/>
</svg>
